services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_starter
    ports:
      - "5432:5432"
    volumes:
      - auth_starter_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_starter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  auth_starter_pgdata:
